<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkipIt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="header">
      <img src="icons/icon-32.png" alt="SkipIt icon" width="24" height="24">
      <div>
        <h1>SkipIt</h1>
        <p>Automatic YouTube skip controls</p>
      </div>
    </header>

    <label class="switch-row" for="enabled-toggle">
      <span>Auto-skip controls</span>
      <input id="enabled-toggle" type="checkbox" role="switch">
    </label>

    <section class="stats" aria-live="polite">
      <div>
        <span class="label">Skipped today</span>
        <strong id="today">0</strong>
      </div>
      <div>
        <span class="label">Total skipped</span>
        <strong id="total">0</strong>
      </div>
    </section>

    <button id="reset" type="button">Reset statistics</button>
    <p id="status" class="status" role="status"></p>
    <p class="notice">Only visible YouTube skip or overlay-close controls are activated. Unskippable ads remain unchanged.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
